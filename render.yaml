# Despliegue de DEMOSTRACIÓN en Render.com (plan gratuito).
# Render → New → Blueprint → elegir este repositorio.
# Ojo: en el plan gratuito el disco no es permanente; con cada despliegue
# se recargan los datos de ejemplo. No introducir datos reales.
services:
  - type: web
    name: portalformacion
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: python manage.py migrate --noinput && python manage.py cargar_datos_iniciales --demo && gunicorn config.wsgi --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEMO_ADMIN_PASSWORD
        generateValue: true
